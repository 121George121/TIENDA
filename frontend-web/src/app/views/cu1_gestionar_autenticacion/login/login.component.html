<div class="auth-container">
  <div class="auth-left">
    <div class="brand-overlay">
      <h1>Shopyn Golden Store</h1>
      <p class="tagline">Premium T-Shirts & Apparel</p>
    </div>
  </div>
  
  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Bienvenido de vuelta</h2>
        <p>Ingresa a tu cuenta para continuar tus compras.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        
        <div class="alert alert-danger" *ngIf="errorMessage" style="color: #ff4757; text-align: center; margin-bottom: 1rem; padding: 0.5rem; background: #fff0f1; border-radius: 8px;">
          {{ errorMessage }}
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-container">
            <i class="icon-mail"></i>
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="tu@correo.com"
              [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            >
          </div>
          <span class="error-msg" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Ingresa un correo electrónico válido.
          </span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <i class="icon-lock"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            >
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              tabindex="-1"
            >
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61C3.87 8.32 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="error-msg" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            La contraseña es obligatoria.
          </span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Recordarme
          </label>
          <a routerLink="/recover-password" class="forgot-pwd">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate ahora</a></p>
      </div>
    </div>
  </div>
</div>
