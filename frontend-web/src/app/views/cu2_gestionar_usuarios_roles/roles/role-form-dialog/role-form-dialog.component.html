<h2 mat-dialog-title class="dialog-title">
  <mat-icon>{{ data.isEdit ? 'edit' : 'security' }}</mat-icon>
  <span>{{ data.isEdit ? 'Editar Rol' : 'Crear Nuevo Rol' }}</span>
</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="form-container">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre del Rol</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. SUPERVISOR, VENDEDOR" id="input-role-nombre">
      <mat-error *ngIf="roleForm.get('nombre')?.hasError('required')">El nombre del rol es requerido</mat-error>
      <mat-error *ngIf="roleForm.get('nombre')?.hasError('minlength')">Debe tener al menos 3 caracteres</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción / Funciones</mat-label>
      <textarea matInput formControlName="descripcion" rows="3" placeholder="Describe las responsabilidades de este rol..." id="input-role-descripcion"></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onCancel()" id="btn-cancel-role">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" id="btn-save-role" class="save-btn">
    <mat-icon>save</mat-icon>
    <span>{{ data.isEdit ? 'Guardar Cambios' : 'Crear Rol' }}</span>
  </button>
</mat-dialog-actions>
